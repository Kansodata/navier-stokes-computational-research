name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-validate:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Run Taylor-Green validation
        run: |
          python -m navier_stokes_research.cli --taylor-green-validation

      - name: Run Taylor-Green convergence validation
        run: |
          python -m navier_stokes_research.cli --taylor-green-convergence

      - name: Run physical decay validation
        run: |
          python -m navier_stokes_research.cli --physical-decay-validation

      - name: Run stress validation 2D
        run: |
          python -m navier_stokes_research.cli --stress-validation-2d

      - name: Run time refinement 2D
        run: |
          python -m navier_stokes_research.cli --time-refinement-2d

      - name: Run multi-resolution energy/enstrophy 2D
        run: |
          python -m navier_stokes_research.cli --multi-resolution-energy-enstrophy-2d

      - name: Run forced turbulence validation 2D
        run: |
          python -m navier_stokes_research.cli --forced-turbulence-validation-2d

      - name: Fail closed on validation artifact statuses
        run: |
          python scripts/check_validation_status.py

      - name: Generate reproducible validation figures
        run: |
          python -m navier_stokes_research.cli --validation-figures

      - name: Generate consolidated scientific validation report
        run: |
          python -m navier_stokes_research.cli --scientific-validation-report
