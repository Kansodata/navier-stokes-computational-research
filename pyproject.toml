[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-stokes-research"
version = "0.1.0"
description = "Research-oriented 2D incompressible Navier-Stokes simulations in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyfftw>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
nsim = "navier_stokes_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
